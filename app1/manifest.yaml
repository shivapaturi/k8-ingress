apiVersion: apps/v1
kind: Deployment

metadata:
  name: app1
  # Deployment labels
  labels:
    purpose: ingress
    project: roboshop
    app: app1

spec:
  replicas: 2

  # These labels are used by ReplicaSet to select Pods.
  # They must match the Pod template labels.
  selector:
    matchLabels:
      purpose: ingress
      project: roboshop
      app: app1

  # Pod definition
  template:
    metadata:
      labels:
        purpose: ingress
        project: roboshop
        app: app1
    spec:
      containers:
        - name: app1
          image: shivapaturi01/app1:v1
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  labels:
    purpose: ingress

spec:
  selector:
    purpose: ingress
    project: roboshop
    app: qpp1

  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80  #container port
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1
  namespace: roboshop
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:211125615103:certificate/9feeeedc-2044-437f-8b9c-fe66761b7f65
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
  - host: "app1.mydaws.site"
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: app1
            port:
              number: 80 # app1 service port
 